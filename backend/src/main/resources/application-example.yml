spring:
  datasource:
    url: jdbc:mysql://localhost:3306/YOUR_DATABASE
    username: YOUR_USERNAME
    password: YOUR_PASSWORD

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: YOUR_JWT_SECRET
  expiration: 86400000